apiVersion: apps/v1
kind: Deployment
metadata:
  name: greenlight
  namespace: greenlight-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: greenlight
  template:
    metadata:
      labels:
        app.kubernetes.io/name: greenlight
    spec:
      serviceAccountName: greenlight
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: greenlight
          image: greenlight:latest
          args:
            # Keep this in sync with the RBAC rules in config/rbac/role.yaml.
            - --watch=netbox.dev/*
            - --rules=/etc/greenlight/netbox.rules.yaml
            - --leader-elect
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            - --log-format=json
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: rules
              mountPath: /etc/greenlight
              readOnly: true
      volumes:
        - name: rules
          configMap:
            name: greenlight-rules
      terminationGracePeriodSeconds: 10
