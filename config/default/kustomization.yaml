apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Every manifest names its namespace explicitly. Change it here and in the
# manifests together if you deploy somewhere else.
namespace: greenlight-system

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: greenlight

resources:
  - namespace.yaml
  - ../rbac
  - ../manager
