version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - goconst
    - misspell
    - nilerr
    - nolintlint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - whitespace
  settings:
    revive:
      rules:
        - name: exported
          disabled: false
        - name: package-comments
    goconst:
      min-occurrences: 4
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - goconst
          - unparam
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/jstudler/greenlight

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
